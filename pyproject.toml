[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chipevolve"
version = "0.1.0"
description = "Deterministic RTL evolution driven by real EDA feedback"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
chipevolve = "chipevolve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chipevolve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
